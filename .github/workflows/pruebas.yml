name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo:
    name: Núcleo (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,visual]"
      - run: python -m pytest -q

  # Riesgo principal de la fase 0: que OpenSeesPy se instale y funcione en cada sistema,
  # en particular en macOS con chip M (macos-latest es arm64).
  motor-opensees:
    name: OpenSees (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
        # El binario de openseespywin 3.8 enlaza python312.dll: en Windows solo
        # funciona con Python 3.12. Los instaladores usarán 3.12 en los tres sistemas.
        exclude:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,opensees]"
      - run: python -c "import openseespy.opensees as ops; print('OpenSeesPy', ops.version() if hasattr(ops, 'version') else 'importado')"
      - run: python -m pytest -q tests/test_opensees.py -rs

  interfaz:
    name: Interfaz (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 fijo: en la imagen 26.04 de ubuntu-latest los espejos de apt fallaban por DNS.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerías de sistema que Qt necesita en Linux
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Los espejos *.ubuntu.com fallaban por DNS desde los runners; se usa el espejo de kernel.org.
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list
          for s in noble noble-updates noble-security; do
            echo "deb http://mirrors.edge.kernel.org/ubuntu $s main universe"
          done | sudo tee /etc/apt/sources.list.d/kernel-org.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gui,prueba-gui]"
      - run: python -m pytest -q tests/test_ventana.py tests/test_sesion.py -rs
