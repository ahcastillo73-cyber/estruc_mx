name: Instaladores

# AppImage (Linux), .dmg (macOS Apple Silicon) e instalador .exe (Windows).
# - Al publicar una etiqueta v* (por ejemplo v0.1.0) se crea un Release con los tres.
# - A mano desde la pestaña Actions («Run workflow»), o en un PR que toque el
#   empaquetado, quedan como artefactos de la ejecución.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "empaquetado/**"
      - ".github/workflows/instaladores.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  construir:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, para que el AppImage corra también en distribuciones no tan nuevas
          - os: ubuntu-22.04
            nombre: Linux (AppImage)
          - os: macos-latest   # arm64
            nombre: macOS Apple Silicon (.dmg)
          - os: windows-latest
            nombre: Windows (instalador .exe)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # 3.12 en los tres: el binario de OpenSeesPy para Windows solo carga con 3.12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
            v="$v-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "valor=$v" >> "$GITHUB_OUTPUT"
          echo "ESTRUC_VERSION=${v%%-*}" >> "$GITHUB_ENV"
          echo "Versión: $v"

      - name: Bibliotecas del sistema (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Los espejos *.ubuntu.com fallaban por DNS desde los runners; se usa el espejo de kernel.org.
          codigo="$(lsb_release -cs)"
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list
          for s in "$codigo" "$codigo-updates" "$codigo-security"; do
            echo "deb http://mirrors.edge.kernel.org/ubuntu $s main universe"
          done | sudo tee /etc/apt/sources.list.d/kernel-org.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-util1 libxcb-xkb1 libfuse2 file

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          # El extra gui existe cuando la interfaz está en la rama; si no, se omite
          extras="opensees,visual,reporte"
          if python -c 'import tomllib,sys; sys.exit(0 if "gui" in tomllib.load(open("pyproject.toml","rb"))["project"]["optional-dependencies"] else 1)'; then
            extras="$extras,gui"
          fi
          echo "Extras: $extras"
          python -m pip install ".[$extras]" "pyinstaller>=6.10"

      - name: Iconos
        run: python empaquetado/iconos.py

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller empaquetado/estruc_mx.spec

      - name: Probar el paquete
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe=dist/estruc-mx/estruc-mx-cli.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then exe=dist/estruc-mx.app/Contents/MacOS/estruc-mx
          else exe=dist/estruc-mx/estruc-mx; fi
          "$exe" --verificar
          "$exe" analizar ejemplos/marco_3niveles.json --motor pynite
          "$exe" analizar ejemplos/marco_3niveles.json --motor opensees
          "$exe" modal ejemplos/marco_3niveles.json --motor opensees --modos 6
          "$exe" reporte ejemplos/marco_3niveles.json -o build/prueba.pdf --sistema marco_concreto_alta
          "$exe" reporte ejemplos/marco_3niveles.json -o build/prueba.docx
          ls -l build/prueba.pdf build/prueba.docx

      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          empaquetado/linux/construir_appimage.sh "${{ steps.version.outputs.valor }}"
          ai=$(ls instaladores/*.AppImage)
          chmod +x "$ai"
          APPIMAGE_EXTRACT_AND_RUN=1 "$ai" --verificar

      - name: .dmg
        if: runner.os == 'macOS'
        run: empaquetado/macos/construir_dmg.sh "${{ steps.version.outputs.valor }}"

      - name: Instalador de Windows
        if: runner.os == 'Windows'
        run: |
          if ! command -v iscc >/dev/null && [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          command -v iscc >/dev/null && ISCC=iscc
          # Sin esto, Git Bash convierte "/DVersion=…" en una ruta de Windows
          MSYS_NO_PATHCONV=1 "$ISCC" "/DVersion=${{ steps.version.outputs.valor }}" "/DVersionNum=$ESTRUC_VERSION" empaquetado/windows/instalador.iss
          # Versión portátil: la misma carpeta en un .zip, sin instalar
          7z a -tzip "instaladores/estruc-mx-${{ steps.version.outputs.valor }}-windows-x64-portatil.zip" ./dist/estruc-mx

      - uses: actions/upload-artifact@v4
        with:
          name: estruc-mx-${{ runner.os }}
          path: instaladores/*
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: Release
    needs: construir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
