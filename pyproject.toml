[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "estruc-mx"
version = "0.1.0"
description = "Análisis estructural de edificios con PyNite y OpenSees, basado en NTC 2023 y CFE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyNiteFEA>=3.2",
]

[project.optional-dependencies]
# 3.8 es la primera con binarios para Windows, Linux y macOS arm64; exige Python 3.12+
opensees = ["openseespy>=3.8"]
visual = ["pyvista>=0.44"]
gui = ["PySide6>=6.6", "pyvista>=0.44", "pyvistaqt>=0.11"]
dev = ["pytest>=8"]
# Solo para las pruebas de la ventana; necesita PySide6 (extra gui)
prueba-gui = ["pytest-qt>=4.4"]

[project.scripts]
estruc-mx = "estruc_mx.cli:main"

[project.gui-scripts]
estruc-mx-gui = "estruc_mx.app.ventana:main"

[tool.hatch.build.targets.wheel]
packages = ["src/estruc_mx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
