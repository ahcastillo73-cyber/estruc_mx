[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "estruc-mx"
version = "0.1.0"
description = "Análisis estructural de edificios con PyNite y OpenSees, basado en NTC 2023 y CFE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyNiteFEA>=3.2",
]

[project.optional-dependencies]
# 3.8 es la primera con binarios para Windows, Linux y macOS arm64; exige Python 3.12+
opensees = ["openseespy>=3.8"]
visual = ["pyvista>=0.44"]
# Reporte PDF (ReportLab) y Word (python-docx); figuras con matplotlib
reporte = ["matplotlib>=3.8", "reportlab>=4.0", "python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
estruc-mx = "estruc_mx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/estruc_mx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
